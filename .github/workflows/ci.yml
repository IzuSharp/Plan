name: Document CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: document-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - name: Select and run document checks
        run: python3 eng/ci/run.py --install-dependencies
