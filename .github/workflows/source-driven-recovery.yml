name: Integrate source-driven Plan continuation
on:
  push:
    branches: [research/source-driven-integration-2026-11-12]
    paths:
      - tools/recovery_source_driven.py
      - .github/workflows/source-driven-recovery.yml
permissions:
  contents: read
jobs:
  revise-and-verify:
    if: github.repository == 'IzuSharp/Plan' && github.ref == 'refs/heads/research/source-driven-integration-2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: Plan
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/NativeWeave-Design
          ref: 8f7f80d10943b9ca6f5c26df563f14423d7d85ab
          persist-credentials: false
          path: NativeWeave-Design
      - name: Apply checked existing-task revisions
        working-directory: Plan
        run: python3 tools/recovery_source_driven.py
      - name: Validate graph hashes, dependencies, ownership and fail-closed gates
        working-directory: Plan
        run: |
          python3 tools/validate_graphs.py --output verification/graph-validation.json
          python3 tools/mutation_checks.py
          python3 -m pip install 'jsonschema==4.23.0'
          python3 - <<'PY'
          import json,pathlib,jsonschema
          schema=json.loads(pathlib.Path('schemas/graph-v1.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          results=[]
          for kind in ('research','documentation','delivery'):
              p=pathlib.Path(kind+'-graph.json')
              errors=[e.message for e in jsonschema.Draft202012Validator(schema).iter_errors(json.loads(p.read_text()))]
              assert not errors,(str(p),errors)
              results.append({'path':str(p),'errors':errors})
          pathlib.Path('verification/schema-validation.json').write_text(json.dumps({'ok':True,'results':results},indent=2)+'\n')
          PY
      - name: Commit scoped documentation to this research branch only
        working-directory: Plan
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={'README.md','AGENTS.md','execution-policy.md','documentation-policy.md','research-policy.md','milestones.md','acceptance-register.md','task-index.md','source-driven-baseline.json','research-graph.json','documentation-graph.json','delivery-graph.json'}
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:]
              assert p in allowed or p.startswith(('tasks/','research-tasks/','documentation-tasks/','verification/','prompts/')),p
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md '*-policy.md' milestones.md acceptance-register.md task-index.md source-driven-baseline.json '*-graph.json' tasks research-tasks documentation-tasks verification prompts
          git commit -m 'docs: align 114 task packets and three graphs with source-driven native contracts'
          git push origin HEAD:refs/heads/research/source-driven-integration-2026-11-12
