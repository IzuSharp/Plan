name: Verify Design-owned native research assets
on:
  push:
    branches: [main, design/public-api-20261114, research/pr1-asset-migration, research/logical-admission-r07, research/source-lifecycle-plan-2026-11-12, research/source-lifecycle-2026-11-12]
    paths:
      - source-driven-baseline.json
      - verification/research-assets-final-trigger.json
      - tools/**
      - schemas/**
      - delivery-graph.json
      - research-graph.json
      - documentation-graph.json
      - tasks/**
      - research-tasks/**
      - documentation-tasks/**
      - ledger/**
      - api-execution-requirements.md
      - public-api-acceptance-workflow.md
      - .github/workflows/native-slices-final-check.yml
  pull_request:
    branches: [main]
    paths:
      - source-driven-baseline.json
      - tools/**
      - ledger/**
      - api-execution-requirements.md
      - public-api-acceptance-workflow.md
      - delivery-graph.json
      - research-graph.json
      - documentation-graph.json
      - schemas/**
      - tasks/**
      - research-tasks/**
      - documentation-tasks/**
      - .github/workflows/native-slices-final-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: Plan
          persist-credentials: false
      - name: Check out the immutable DB-Perf-01 record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Plan
          ref: 38f8ce8a01f88e6e4c4459926f197c5438c2f6fc
          fetch-depth: 0
          path: perf-history/Plan
          persist-credentials: false
      - name: Run the unchanged historical performance record gate
        working-directory: perf-history/Plan
        run: python3 tools/verify_db_perf.py
      - name: Check out the immutable DB-Rename-01 input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Plan
          ref: bc1956936ee77a997a016856c97def6aabc0bbc6
          fetch-depth: 0
          path: rename-history/Plan
          persist-credentials: false
      - name: Run unchanged naming and completed Fluent ORM history gates
        working-directory: rename-history/Plan
        run: python3 tools/verify_db_rename.py
      - name: Check out the immutable completed DB-CPP-01 input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Plan
          ref: 5be447a868be78713ada52f46cee16409f0edc13
          fetch-depth: 0
          path: cpp-history/Plan
          persist-credentials: false
      - name: Run unchanged completed C++ migration acceptance gates
        working-directory: cpp-history/Plan
        run: python3 tools/verify_db_cpp.py --require-complete
      - name: Check out the immutable completed DB-Scope-01 input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Plan
          ref: 1fe52a8bd792ccdbb4bbea17ba59b0ad0c24349d
          fetch-depth: 0
          path: scope-history/Plan
          persist-credentials: false
      - name: Run unchanged completed database-scope acceptance gates
        working-directory: scope-history/Plan
        run: python3 tools/verify_db_scope.py
      - name: Check out the immutable historical Plan acceptance input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Plan
          ref: 8afa0311f45ab8a8157fc45c51e95a0b17dd09f2
          fetch-depth: 0
          path: historical/Plan
          persist-credentials: false
      - name: Check out its immutable Design input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/Korda-Design
          ref: c62cdb8aee833b6ab1a03e29a3f59f81a1b483f9
          fetch-depth: 0
          # Frozen tools and evidence keys require the original directory name.
          path: historical/NativeWeave-Design
          persist-credentials: false
      - name: Run every unchanged historical provenance and graph gate
        working-directory: historical/Plan
        run: |
          python3 tools/verify_public_api_history.py
          python3 tools/verify_public_api_plan.py
          python3 tools/prepare_acceptance.py verify-contracts
          python3 tools/prepare_acceptance.py verify-tasks
          python3 tools/binding_attestation_checks.py
          python3 tools/verify_completion.py --require-complete
          python3 tools/verify_research_assets.py
          python3 tools/verify_logical_admission_history.py
          python3 tools/verify_source_lifecycle.py
          python3 tools/source_lifecycle_binding_checks.py
          python3 tools/validate_graphs.py --output verification/graph-validation.json
          python3 tools/mutation_checks.py
          python3 tools/host_selection_checks.py
          python3 tools/rust1100_checks.py
          python3 -m pip install 'jsonschema==4.23.0'
          python3 - <<'PY'
          from pathlib import Path
          import json,jsonschema
          s=json.loads(Path('schemas/graph-v1.schema.json').read_text())
          for k in ('research','documentation','delivery'):
              jsonschema.Draft202012Validator(s).validate(json.loads(Path(k+'-graph.json').read_text()))
          print('PASS all three graph schemas')
          PY
      - name: Validate the historical performance acceptance schema
        working-directory: perf-history/Plan
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,jsonschema
          schema=json.loads(Path('schemas/db-perf-v1.schema.json').read_text())
          record=json.loads(Path('ledger/evidence/batches/DB-Perf-01/acceptance.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(record)
          print('PASS DB-Perf-01 acceptance schema; no performance execution inferred')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-assets-plan-integrity
          retention-days: 30
          path: |
            historical/Plan/verification/*.json
            historical/Plan/verification/public-api-history/**
            historical/Plan/ledger/checkpoints/research-assets-migration.json
            historical/Plan/ledger/checkpoints/logical-admission-r07.json
            historical/Plan/ledger/checkpoints/source-lifecycle-2026-11-13.json
            historical/Plan/verification/source-lifecycle-reviews/**
            historical/Plan/source-driven-baseline.json
            Plan/ledger/evidence/batches/DB-Scope-01/
            Plan/ledger/evidence/batches/DB-CPP-01/
            Plan/ledger/evidence/batches/DB-API-01/
            Plan/ledger/evidence/batches/DB-Rename-01/
            Plan/ledger/evidence/batches/DB-Perf-01/
