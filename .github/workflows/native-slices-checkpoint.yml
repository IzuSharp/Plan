name: Record tested native slices in existing Plan
on:
  push:
    branches: [research/native-slices-evidence-2026-11-12]
    paths:
      - tools/native_slices_checkpoint.py
      - .github/workflows/native-slices-checkpoint.yml
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'IzuSharp/Plan' && github.ref == 'refs/heads/research/native-slices-evidence-2026-11-12'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: Plan
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/NativeWeave-Design
          ref: d4ad42df26ee9378817aa8ee94cd1853d66eb0ae
          path: NativeWeave-Design
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IzuSharp/NativeWeave
          ref: 267364a440074a61e193cf33315f1b9d0fa8126b
          path: NativeWeave
          persist-credentials: false
      - name: Apply scoped checkpoint, revisions and exact evidence pins
        working-directory: Plan
        run: python3 tools/native_slices_checkpoint.py
      - name: Validate all existing gates without accepting proposed work
        working-directory: Plan
        run: |
          python3 tools/validate_graphs.py --output verification/graph-validation.json
          python3 tools/mutation_checks.py
          python3 tools/rust1100_checks.py
          python3 -m pip install 'jsonschema==4.23.0'
          python3 - <<'PY'
          from pathlib import Path
          import json,jsonschema
          schema=json.loads(Path('schemas/graph-v1.schema.json').read_text())
          results=[]
          for k in ('research','documentation','delivery'):
              data=json.loads(Path(k+'-graph.json').read_text())
              jsonschema.Draft202012Validator(schema).validate(data)
              results.append({'path':k+'-graph.json','errors':[]})
          Path('verification/schema-validation.json').write_text(json.dumps({'ok':True,'results':results},indent=2)+'\n')
          PY
      - name: Commit verified Plan changes on the feature branch
        working-directory: Plan
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          # Inspect individual untracked files, not Git's collapsed directory names.
          for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
              p=line[3:]
              assert p in ('research-graph.json','documentation-graph.json','delivery-graph.json','task-index.md','source-driven-baseline.json') or p.startswith(('research-tasks/','documentation-tasks/','tasks/','verification/','ledger/checkpoints/')),p
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*-graph.json' task-index.md source-driven-baseline.json research-tasks documentation-tasks tasks verification ledger/checkpoints
          git commit -m 'docs: advance existing partial tasks with verified native-slice evidence'
          git push origin HEAD:refs/heads/research/native-slices-evidence-2026-11-12
