syntax = "proto3";
package nativeweave.samples;
option csharp_namespace = "NativeWeave.Grpc.Sample.Messages";

message EchoRequest {
  string text = 1;
  bytes payload = 2;
  int32 count = 3;
}
message EchoReply {
  string text = 1;
  bytes payload = 2;
  int32 index = 3;
}
service EchoApi {
  rpc Echo(EchoRequest) returns (EchoReply);
  rpc Repeat(EchoRequest) returns (stream EchoReply);
  rpc Sum(stream EchoRequest) returns (EchoReply);
  rpc Duplex(stream EchoRequest) returns (stream EchoReply);
  rpc Fail(EchoRequest) returns (EchoReply);
  rpc Wait(EchoRequest) returns (stream EchoReply);
}
